apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: studymatch
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
      - image: gcr.io/PROJECT_ID/studymatch # Replace with your project ID and image registry
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGODB_URI
          value: "your_mongodb_uri_here" # It is recommended to use Secret Manager for this
        - name: JWT_SECRET
          value: "your_jwt_secret_here" # It is recommended to use Secret Manager for this
        - name: CLIENT_URL
          value: "https://studymatch.example.com" # Replace with the actual URL your app will run on
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
